<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kniha jízd</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; }
        input, select, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        li { margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>Kniha jízd</h2>
    <form id="form">
        <input type="text" id="odkud" placeholder="Odkud" required>
        <input type="text" id="kam" placeholder="Kam" required>
        <input type="number" id="km" placeholder="Ujeté km" required>
        <select id="typ">
            <option value="Soukromá">Soukromá</option>
            <option value="Pracovní">Pracovní</option>
        </select>
        <input type="text" id="tankovani" placeholder="Poznámka (např. tankování)">
        <button type="submit">Uložit jízdu</button>
    </form>
    <h3>Záznamy:</h3>
    <ul id="zaznamy"></ul>

    <script>
        const form = document.getElementById('form');
        const seznam = document.getElementById('zaznamy');
        let jizdy = JSON.parse(localStorage.getItem('kniha_jizd')) || [];

        function vykresli() {
            seznam.innerHTML = jizdy.map(j => `<li><b>${j.odkud} ➔ ${j.kam}</b>: ${j.km} km (${j.typ}) <i>${j.tankovani}</i></li>`).join('');
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            jizdy.push({
                odkud: document.getElementById('odkud').value,
                kam: document.getElementById('kam').value,
                km: document.getElementById('km').value,
                typ: document.getElementById('typ').value,
                tankovani: document.getElementById('tankovani').value
            });
            localStorage.setItem('kniha_jizd', JSON.stringify(jizdy));
            form.reset();
            vykresli();
        });
        vykresli();
    </script>
</body>
</html>
