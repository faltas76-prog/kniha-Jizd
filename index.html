<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Kniha jízd</title>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; color: var(--primary); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-export { background-color: #28a745; margin-bottom: 20px; }
        .btn-export:hover { background-color: #218838; }
        label { font-size: 0.9em; font-weight: bold; color: #555; }
        .odkaz { display: block; text-align: center; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚗 Kniha jízd</h2>
        <div class="card">
            <form id="form">
                <label>Datum jízdy:</label>
                <input type="date" id="datum" required>
                <input type="text" id="odkud" placeholder="Odkud (např. Praha)" required>
                <input type="text" id="kam" placeholder="Kam (např. Brno)" required>
                <input type="number" id="km" placeholder="Ujeté km" required>
                <select id="typ">
                    <option value="Pracovní">💼 Pracovní</option>
                    <option value="Soukromá">🏠 Soukromá</option>
                </select>
                <label>Tankování (volitelné):</label>
                <input type="date" id="datum_tankovani">
                <input type="text" id="tankovani" placeholder="Poznámka k tankování">
                <button type="submit">Uložit jízdu</button>
            </form>
        </div>
        
        <button class="btn-export" onclick="exportCSV()">📥 Stáhnout report (CSV)</button>
        <a href="zaznamy.html" class="odkaz">📄 Zobrazit historii jízd</a>
    </div>

    <script>
        const form = document.getElementById('form');
        document.getElementById('datum').valueAsDate = new Date(); 

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Správné načtení a přidání do pole
            let jizdy = JSON.parse(localStorage.getItem('kniha_jizd')) || [];
            
            jizdy.push({
                datum: document.getElementById('datum').value,
                odkud: document.getElementById('odkud').value,
                kam: document.getElementById('kam').value,
                km: document.getElementById('km').value,
                typ: document.getElementById('typ').value,
                datum_tankovani: document.getElementById('datum_tankovani').value,
                tankovani: document.getElementById('tankovani').value
            });
            
            // Správné uložení pole jako text
            localStorage.setItem('kniha_jizd', JSON.stringify(jizdy));
            
            form.reset();
            document.getElementById('datum').valueAsDate = new Date();
            alert('Jízda byla úspěšně uložena!');
        });

        function exportCSV() {
            let jizdy = JSON.parse(localStorage.getItem('kniha_jizd')) || [];
            let csv = '\uFEFFDatum jízdy,Odkud,Kam,Km,Typ,Datum tankování,Poznámka\n';
            jizdy.forEach(j => {
                csv += `${j.datum},${j.odkud},${j.kam},${j.km},${j.typ},${j.datum_tankovani || ''},${j.tankovani || ''}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'report_jizd.csv';
            link.click();
        }
    </script>
</body>
</html>
